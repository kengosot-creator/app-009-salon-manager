

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8FBC8F">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Salon Manager</title>
  <style>
    
    :root {
      --green: #8FBC8F;
      --green-dark: #527653;
      --green-light: #DCE8D9;
      --bg: #E9EFE6;
      --text: #343B35;
      --muted: #778477;
      --line: #D9E2D6;
      --white: #FFFFFF;
      --brown: #B99A7D;
      --danger: #C87575;
      --shadow: 0 8px 28px rgba(65, 85, 65, .10);
    }


    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP",
        "Yu Gothic", Meiryo, sans-serif;
      letter-spacing: .025em;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 24px 60px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: var(--green-dark);
      color: white;
      display: grid;
      place-items: center;
      font-size: 25px;
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      letter-spacing: .02em;
      color: var(--green-dark);
      line-height: 1.15;
    }

    .brand-sub {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .19em;
      margin-top: 5px;
    }

    .header-date {
      color: var(--muted);
      font-size: 13px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 23px;
      font-weight: 500;
      margin: 0 0 7px;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      margin: 0;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .summary-card {
      background: white;
      border-radius: 17px;
      padding: 21px 23px;
      box-shadow: var(--shadow);
    }

    .summary-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
    }

    .summary-value {
      font-size: 29px;
      font-weight: 600;
      color: var(--green-dark);
    }

    .summary-unit {
      font-size: 12px;
      font-weight: 400;
      margin-left: 5px;
      color: var(--muted);
    }

    .main-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: var(--shadow);
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
    }

    .section-heading h2 {
      font-size: 17px;
      font-weight: 600;
      margin: 0;
    }

    .date-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-controls input {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 11px;
      color: var(--text);
      background: white;
    }

    .small-button {
      background: var(--green-light);
      border: none;
      color: var(--green-dark);
      border-radius: 9px;
      padding: 9px 13px;
    }

    .add-button {
      background: var(--green);
      color: white;
      border: none;
      border-radius: 11px;
      padding: 12px 19px;
      font-weight: 600;
      transition: .2s;
    }

    .add-button:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }

    .reservation-list {
      display: flex;
      flex-direction: column;
    }

    .reservation {
      display: grid;
      grid-template-columns: 90px 5px 1fr auto;
      align-items: center;
      gap: 17px;
      padding: 19px 10px;
      border-bottom: 1px solid var(--line);
    }

    .reservation:last-child { border-bottom: none; }

    .reservation-time {
      font-size: 18px;
      font-weight: 600;
      color: var(--green-dark);
      font-variant-numeric: tabular-nums;
    }

    .reservation-bar {
      width: 4px;
      height: 43px;
      border-radius: 5px;
      background: var(--green);
    }

    .reservation-bar.color { background: var(--brown); }

    .customer-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .reservation-detail {
      font-size: 12px;
      color: var(--muted);
    }

    .menu-tag {
      display: inline-block;
      background: var(--green-light);
      color: var(--green-dark);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      white-space: nowrap;
    }

    .menu-tag.color {
      background: #F5EFE9;
      color: #96795F;
    }

    .delete-button {
      border: none;
      background: transparent;
      color: #B7BDB6;
      font-size: 12px;
      padding: 8px;
    }

    .delete-button:hover { color: var(--danger); }

    .empty {
      padding: 55px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .empty-icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .footer {
      text-align: center;
      color: #A3AAA2;
      font-size: 10px;
      letter-spacing: .12em;
      margin-top: 30px;
    }

    /* Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(35, 45, 35, .4);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-backdrop.show { display: flex; }

    .modal {
      background: white;
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 27px;
      box-shadow: 0 20px 60px rgba(0,0,0,.15);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 23px;
    }

    .modal-header h2 {
      font-size: 19px;
      font-weight: 600;
      margin: 0;
    }

    .close-button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
    }

    .form-group { margin-bottom: 19px; }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 9px;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--text);
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--green);
    }

    .menu-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .menu-option {
      border: 1px solid var(--line);
      background: white;
      border-radius: 11px;
      padding: 13px 8px;
      color: var(--text);
    }

    .menu-option.selected {
      background: var(--green-light);
      border: 2px solid var(--green);
      color: var(--green-dark);
    }

    .menu-option strong {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .menu-option span {
      font-size: 11px;
      color: var(--muted);
    }

    .availability-note {
      background: var(--green-light);
      color: var(--green-dark);
      padding: 11px;
      border-radius: 9px;
      font-size: 12px;
      margin-top: 9px;
    }

    .warning {
      display: none;
      color: var(--danger);
      background: #FBF0F0;
      border-radius: 9px;
      padding: 11px;
      font-size: 12px;
      margin-top: 10px;
    }

    .warning.show { display: block; }

    .submit-button {
      width: 100%;
      border: none;
      background: var(--green);
      color: white;
      border-radius: 11px;
      padding: 14px;
      font-weight: 600;
      margin-top: 8px;
    }

    .submit-button:hover { background: var(--green-dark); }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #425A43;
      color: white;
      padding: 13px 22px;
      border-radius: 30px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      z-index: 20;
      white-space: nowrap;
    }

    .toast.show { opacity: 1; }


    /* Monthly calendar */
    .calendar-card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }
    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .calendar-month {
      color: var(--green-dark);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .calendar-nav { display: flex; gap: 7px; }
    .calendar-weekdays, .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .calendar-weekday {
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      padding: 7px 0;
    }
    .calendar-weekday:first-child { color: #C87575; }
    .calendar-weekday:last-child { color: #7895B5; }
    .calendar-day {
      min-width: 0;
      min-height: 75px;
      border: 1px solid transparent;
      border-radius: 11px;
      background: #F8FAF7;
      color: var(--text);
      padding: 8px 5px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .calendar-day:hover { border-color: var(--green); }
    .calendar-day.other-month { opacity: .35; background: white; }
    .calendar-day.selected { background: var(--green-light); border-color: var(--green); }
    .calendar-day.today .day-number { color: var(--green-dark); font-weight: 800; }
    .day-number { font-size: 13px; font-weight: 500; }
    .day-menu-counts {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      width: 100%;
      margin-top: 2px;
    }
    .day-menu-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 100%;
      font-size: 9px;
      line-height: 1.25;
      font-weight: 600;
      white-space: nowrap;
    }
    .day-menu-count.cut { color: var(--green-dark); }
    .day-menu-count.color { color: #96795F; }
    .calendar-legend {
      display: flex; gap: 15px; flex-wrap: wrap;
      color: var(--muted); font-size: 10px; margin-top: 13px;
    }
    .calendar-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
    .legend-dot.color { background: var(--brown); }
    .calendar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .availability-panel {
      display: none;
      background: #FFFFFF;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      margin: -8px 0 22px;
      box-shadow: var(--shadow);
    }
    .availability-panel.show { display: block; }
    .availability-heading { font-size: 16px; font-weight: 600; color: var(--green-dark); margin: 0 0 15px; }
    .availability-controls { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
    .availability-controls label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .availability-controls input, .availability-controls select {
      width: 100%; padding: 11px; border: 1px solid var(--line); border-radius: 9px;
      background: white; color: var(--text); min-height: 42px;
    }
    .availability-results { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .available-slot {
      border: 1px solid var(--green); background: var(--green-light); color: var(--green-dark);
      border-radius: 9px; padding: 10px 14px; font-weight: 600; font-size: 13px;
    }
    .available-slot:hover { background: var(--green); color: white; }
    .availability-empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
    @media (max-width: 650px) {
      .availability-panel { padding: 17px 13px; }
      .availability-controls { grid-template-columns: 1fr 1fr; }
      .availability-controls .search-action { grid-column: 1 / -1; }
      .availability-controls .search-action button { width: 100%; }
    }

    @media (max-width: 650px) {
      .calendar-card { padding: 17px 11px; }
      .calendar-day { min-height: 61px; padding: 6px 2px; gap: 4px; }
      .day-number { font-size: 12px; }
      .day-menu-count { font-size: 8px; letter-spacing: -.04em; }
      .calendar-weekdays, .calendar-grid { gap: 3px; }
      .calendar-month { font-size: 18px; }
    }

    @media (max-width: 650px) {
      .app { padding: 20px 15px 45px; }
      header { margin-bottom: 25px; }
      .brand-name { font-size: 22px; }
      .header-date { display: none; }
      .welcome h1 { font-size: 20px; }
      .summary { gap: 9px; }
      .summary-card { padding: 15px 12px; }
      .summary-label { font-size: 10px; }
      .summary-value { font-size: 24px; }
      .main-card { padding: 19px 14px; }
      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }
      .date-controls { width: 100%; }
      .date-controls input { flex: 1; min-width: 0; }
      .reservation {
        grid-template-columns: 58px 4px 1fr auto;
        gap: 10px;
        padding: 17px 2px;
      }
      .reservation-time { font-size: 15px; }
      .customer-name { font-size: 13px; }
      .menu-tag { padding: 5px 8px; font-size: 10px; }
      .delete-button { font-size: 11px; padding: 4px; }
    }
  </style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="brand-icon">✂</div>
      <div>
        <div class="brand-name">Salon Manager</div>
        <div class="brand-sub">RESERVATION MANAGEMENT</div>
      </div>
    </div>
    <div class="header-date" id="todayLabel"></div>
  </header>

  <section class="welcome">
    <h1>おはようございます。</h1>
    <p>今日も素敵な一日を。</p>
  </section>

  <section class="summary">
    <div class="summary-card">
      <div class="summary-label">本日の予約</div>
      <div class="summary-value"><span id="countToday">0</span><span class="summary-unit">件</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">カット</div>
      <div class="summary-value"><span id="countCut">0</span><span class="summary-unit">件</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">カラー</div>
      <div class="summary-value"><span id="countColor">0</span><span class="summary-unit">件</span></div>
    </div>
  </section>


  <section class="calendar-card">
    <div class="calendar-toolbar">
      <div class="calendar-month" id="calendarMonth">2026年11月</div>
      <div class="calendar-actions">
        <button class="add-button" id="toggleAvailability">⌕ 空き時間を探す</button>
        <div class="calendar-nav">
          <button class="small-button" id="prevMonth" aria-label="前の月">‹</button>
          <button class="small-button" id="calendarToday">今月</button>
          <button class="small-button" id="nextMonth" aria-label="次の月">›</button>
        </div>
      </div>
    </div>
    <div class="calendar-weekdays">
      <div class="calendar-weekday">日</div><div class="calendar-weekday">月</div>
      <div class="calendar-weekday">火</div><div class="calendar-weekday">水</div>
      <div class="calendar-weekday">木</div><div class="calendar-weekday">金</div>
      <div class="calendar-weekday">土</div>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="calendar-legend">
      <span><i class="legend-dot"></i>カット</span>
      <span><i class="legend-dot color"></i>カラー</span>
      <span>日付を選ぶと下に予約一覧を表示</span>
    </div>
  </section>

  <section class="availability-panel" id="availabilityPanel">
    <h2 class="availability-heading">空き時間検索</h2>
    <div class="availability-controls">
      <div>
        <label for="searchDate">予約希望日</label>
        <input type="date" id="searchDate">
      </div>
      <div>
        <label for="searchMenu">メニュー</label>
        <select id="searchMenu">
          <option value="カット">カット（60分）</option>
          <option value="カラー">カラー（120分）</option>
        </select>
      </div>
      <div class="search-action">
        <button class="add-button" id="runAvailabilitySearch">空きを検索</button>
      </div>
    </div>
    <div class="availability-results" id="availabilityResults">
      <div class="availability-empty">日付とメニューを選んで「空きを検索」を押してください。</div>
    </div>
  </section>

  <main class="main-card">
    <div class="section-heading">
      <h2>Reservation List <span style="font-size:12px;color:#89918A;font-weight:400;">予約一覧</span></h2>
      <div class="date-controls">
        <button class="small-button" id="prevDay">‹</button>
        <input type="date" id="selectedDate">
        <button class="small-button" id="nextDay">›</button>
        <button class="small-button" id="todayButton">今日</button>
      </div>
    </div>

    <div class="section-heading" style="margin-bottom:12px;">
      <div id="listDate" style="font-size:13px;color:#89918A;"></div>
      <button class="add-button" id="openModal">＋ 予約を追加</button>
    </div>

    <div class="reservation-list" id="reservationList"></div>
  </main>

  <div class="footer">SALON MANAGER · SIMPLE & BEAUTIFUL</div>
</div>

<!-- 予約登録モーダル -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <h2>新しい予約</h2>
      <button class="close-button" id="closeModal">×</button>
    </div>

    <form id="reservationForm">
      <div class="form-group">
        <label for="reserveDate">予約日</label>
        <input type="date" id="reserveDate" required>
      </div>

      <div class="form-group">
        <label>メニュー</label>
        <div class="menu-options">
          <button type="button" class="menu-option selected" data-menu="カット">
            <strong>カット</strong><span>60分</span>
          </button>
          <button type="button" class="menu-option" data-menu="カラー">
            <strong>カラー</strong><span>120分</span>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="reserveName">お客様のお名前</label>
        <input type="text" id="reserveName" placeholder="例：山田 花子" required maxlength="30">
      </div>

      <div class="form-group">
        <label for="reserveTime">予約開始時間</label>
        <select id="reserveTime" required></select>
        <div class="availability-note" id="availabilityNote"></div>
        <div class="warning" id="warning"></div>
      </div>

      <button type="submit" class="submit-button">この内容で予約する</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = "salonManagerDemoReservations";

  const openingHour = 9;
  const closingHour = 19;
  const slotMinutes = 30;

  const today = new Date();
  const dateString = d => {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  };

  const formatDate = value => {
    const d = new Date(value + "T00:00:00");
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
  };

  const formatTime = minutes =>
    `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}`;

  const duration = menu => menu === "カラー" ? 120 : 60;

  let reservations = loadReservations();
  let selectedMenu = "カット";

  function loadReservations() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
    } catch (e) {
      console.error("予約データを読み込めませんでした", e);
    }

    // デモ用の架空データ
    const date = dateString(today);
    return [
      { id: "demo1", date, time: "09:00", name: "山田 様", menu: "カット" },
      { id: "demo2", date, time: "11:00", name: "佐藤 様", menu: "カラー" },
      { id: "demo3", date, time: "14:00", name: "鈴木 様", menu: "カット" },
      { id: "demo4", date, time: "16:00", name: "田中 様", menu: "カラー" }
    ];
  }

  function saveReservations() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(reservations));
  }

  const selectedDate = document.getElementById("selectedDate");
  const reserveDate = document.getElementById("reserveDate");
  const reserveTime = document.getElementById("reserveTime");
  const warning = document.getElementById("warning");
  const availabilityNote = document.getElementById("availabilityNote");
  const modalBackdrop = document.getElementById("modalBackdrop");

  selectedDate.value = dateString(today);
  let calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);

  function getReservations(date) {
    return reservations
      .filter(r => r.date === date)
      .sort((a, b) => a.time.localeCompare(b.time));
  }

  function timeToMinutes(time) {
    const [h, m] = time.split(":").map(Number);
    return h * 60 + m;
  }

  function isAvailable(date, start, length, ignoreId = null) {
    const startMin = timeToMinutes(start);
    const endMin = startMin + length;

    if (startMin < openingHour * 60 || endMin > closingHour * 60) {
      return false;
    }

    return !reservations.some(r => {
      if (r.date !== date || r.id === ignoreId) return false;

      const otherStart = timeToMinutes(r.time);
      const otherEnd = otherStart + duration(r.menu);

      return startMin < otherEnd && endMin > otherStart;
    });
  }

  function getAvailableTimes(date, menu) {
    const length = duration(menu);
    const result = [];

    for (
      let min = openingHour * 60;
      min + length <= closingHour * 60;
      min += slotMinutes
    ) {
      const time = formatTime(min);
      if (isAvailable(date, time, length)) result.push(time);
    }

    return result;
  }


  function renderCalendar() {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    document.getElementById("calendarMonth").textContent = `${year}年${month + 1}月`;

    const firstDay = new Date(year, month, 1);
    const start = new Date(year, month, 1 - firstDay.getDay());
    const grid = document.getElementById("calendarGrid");
    const selected = selectedDate.value;
    const todayValue = dateString(today);
    let cells = "";

    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const value = dateString(d);
      const dayReservations = getReservations(value);
      const cutCount = dayReservations.filter(r => r.menu === "カット").length;
      const colorCount = dayReservations.filter(r => r.menu === "カラー").length;
      const classes = [
        "calendar-day",
        d.getMonth() !== month ? "other-month" : "",
        value === selected ? "selected" : "",
        value === todayValue ? "today" : ""
      ].filter(Boolean).join(" ");
      const menuCounts = `
        ${cutCount ? `<span class="day-menu-count cut">カット ${cutCount}</span>` : ""}
        ${colorCount ? `<span class="day-menu-count color">カラー ${colorCount}</span>` : ""}
      `;
      cells += `<button type="button" class="${classes}" data-calendar-date="${value}">
        <span class="day-number">${d.getDate()}</span>
        <span class="day-menu-counts">${menuCounts}</span>
      </button>`;
    }
    grid.innerHTML = cells;
    grid.querySelectorAll("[data-calendar-date]").forEach(button => {
      button.addEventListener("click", () => {
        selectedDate.value = button.dataset.calendarDate;
        calendarMonth = new Date(selectedDate.value + "T00:00:00");
        calendarMonth.setDate(1);
        render();
      });
    });
  }

  function render() {
    renderCalendar();
    const date = selectedDate.value;
    const list = getReservations(date);

    document.getElementById("listDate").textContent = formatDate(date);
    document.getElementById("countToday").textContent = list.length;
    document.getElementById("countCut").textContent =
      list.filter(r => r.menu === "カット").length;
    document.getElementById("countColor").textContent =
      list.filter(r => r.menu === "カラー").length;

    const container = document.getElementById("reservationList");

    if (list.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">✂</div>
          この日の予約はありません。
        </div>`;
      return;
    }

    container.innerHTML = list.map(r => `
      <div class="reservation">
        <div class="reservation-time">${escapeHTML(r.time)}</div>
        <div class="reservation-bar ${r.menu === "カラー" ? "color" : ""}"></div>
        <div>
          <div class="customer-name">${escapeHTML(r.name)}</div>
          <div class="reservation-detail">${escapeHTML(r.menu)} ・ ${duration(r.menu)}分</div>
        </div>
        <div style="display:flex;align-items:center;gap:5px;">
          <span class="menu-tag ${r.menu === "カラー" ? "color" : ""}">
            ${escapeHTML(r.menu)}
          </span>
          <button class="delete-button" data-delete="${escapeHTML(r.id)}">削除</button>
        </div>
      </div>
    `).join("");

    container.querySelectorAll("[data-delete]").forEach(button => {
      button.addEventListener("click", () => deleteReservation(button.dataset.delete));
    });
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    })[char]);
  }

  function updateTimeOptions() {
    const date = reserveDate.value;
    const times = getAvailableTimes(date, selectedMenu);

    reserveTime.innerHTML = "";

    if (times.length === 0) {
      reserveTime.innerHTML = '<option value="">空き時間がありません</option>';
      availabilityNote.textContent = "この日は予約可能な時間がありません。";
      return;
    }

    times.forEach(time => {
      const option = document.createElement("option");
      option.value = time;
      option.textContent = `${time} ～ ${formatTime(timeToMinutes(time) + duration(selectedMenu))}`;
      reserveTime.appendChild(option);
    });

    availabilityNote.textContent =
      `現在 ${times.length} 枠の空きがあります。営業時間 9:00～19:00`;
  }

  function openModal(date = selectedDate.value, menu = "カット", presetTime = "") {
    reserveDate.value = date;
    document.getElementById("reserveName").value = "";
    warning.classList.remove("show");
    selectedMenu = menu;

    document.querySelectorAll(".menu-option").forEach(button => {
      button.classList.toggle("selected", button.dataset.menu === selectedMenu);
    });

    updateTimeOptions();
    if (presetTime) reserveTime.value = presetTime;
    modalBackdrop.classList.add("show");
  }

  function closeModal() {
    modalBackdrop.classList.remove("show");
  }

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2400);
  }

  function deleteReservation(id) {
    if (!confirm("この予約を削除しますか？")) return;
    reservations = reservations.filter(r => r.id !== id);
    saveReservations();
    render();
    showToast("予約を削除しました");
  }

  const availabilityPanel = document.getElementById("availabilityPanel");
  const searchDate = document.getElementById("searchDate");
  const searchMenu = document.getElementById("searchMenu");
  const availabilityResults = document.getElementById("availabilityResults");

  document.getElementById("toggleAvailability").addEventListener("click", () => {
    const isOpening = !availabilityPanel.classList.contains("show");
    availabilityPanel.classList.toggle("show", isOpening);
    if (isOpening) {
      searchDate.value = selectedDate.value;
      searchMenu.value = "カット";
      searchDate.focus();
      searchAvailability();
    }
  });

  function searchAvailability() {
    const date = searchDate.value;
    const menu = searchMenu.value;
    if (!date) {
      availabilityResults.innerHTML = '<div class="availability-empty">予約希望日を選択してください。</div>';
      return;
    }
    const times = getAvailableTimes(date, menu);
    if (times.length === 0) {
      availabilityResults.innerHTML = '<div class="availability-empty">この日に予約可能な時間はありません。別の日付をお試しください。</div>';
      return;
    }
    availabilityResults.innerHTML = times.map(time =>
      `<button type="button" class="available-slot" data-slot="${time}">${time} ～ ${formatTime(timeToMinutes(time) + duration(menu))}</button>`
    ).join("");
    availabilityResults.querySelectorAll("[data-slot]").forEach(button => {
      button.addEventListener("click", () => {
        selectedDate.value = date;
        calendarMonth = new Date(date + "T00:00:00");
        calendarMonth.setDate(1);
        render();
        openModal(date, menu, button.dataset.slot);
      });
    });
  }

  document.getElementById("runAvailabilitySearch").addEventListener("click", searchAvailability);
  searchDate.addEventListener("change", searchAvailability);
  searchMenu.addEventListener("change", searchAvailability);

  document.getElementById("openModal").addEventListener("click", openModal);
  document.getElementById("closeModal").addEventListener("click", closeModal);

  modalBackdrop.addEventListener("click", e => {
    if (e.target === modalBackdrop) closeModal();
  });

  selectedDate.addEventListener("change", () => {
    if (selectedDate.value) {
      calendarMonth = new Date(selectedDate.value + "T00:00:00");
      calendarMonth.setDate(1);
    }
    render();
  });


  document.getElementById("prevMonth").addEventListener("click", () => {
    calendarMonth.setMonth(calendarMonth.getMonth() - 1);
    renderCalendar();
  });

  document.getElementById("nextMonth").addEventListener("click", () => {
    calendarMonth.setMonth(calendarMonth.getMonth() + 1);
    renderCalendar();
  });

  document.getElementById("calendarToday").addEventListener("click", () => {
    calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    selectedDate.value = dateString(today);
    render();
  });

  document.getElementById("todayButton").addEventListener("click", () => {
    selectedDate.value = dateString(today);
    calendarMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    render();
  });

  function shiftDate(days) {
    const d = new Date(selectedDate.value + "T00:00:00");
    d.setDate(d.getDate() + days);
    selectedDate.value = dateString(d);
    calendarMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    render();
  }

  document.getElementById("prevDay").addEventListener("click", () => shiftDate(-1));
  document.getElementById("nextDay").addEventListener("click", () => shiftDate(1));

  document.querySelectorAll(".menu-option").forEach(button => {
    button.addEventListener("click", () => {
      selectedMenu = button.dataset.menu;
      document.querySelectorAll(".menu-option").forEach(b =>
        b.classList.toggle("selected", b === button)
      );
      updateTimeOptions();
      warning.classList.remove("show");
    });
  });

  reserveDate.addEventListener("change", updateTimeOptions);

  document.getElementById("reservationForm").addEventListener("submit", e => {
    e.preventDefault();

    const date = reserveDate.value;
    const time = reserveTime.value;
    const name = document.getElementById("reserveName").value.trim();

    if (!date || !time || !name) {
      warning.textContent = "入力内容を確認してください。";
      warning.classList.add("show");
      return;
    }

    if (!isAvailable(date, time, duration(selectedMenu))) {
      warning.textContent = "⚠️ この時間はすでに埋まっています。別の時間を選択してください。";
      warning.classList.add("show");
      updateTimeOptions();
      return;
    }

    reservations.push({
      id: Date.now().toString(),
      date,
      time,
      name,
      menu: selectedMenu
    });

    saveReservations();
    selectedDate.value = date;
    calendarMonth = new Date(date + "T00:00:00");
    calendarMonth.setDate(1);
    render();
    closeModal();
    showToast("予約を登録しました");
  });

  document.getElementById("todayLabel").textContent =
    `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, "0")}.${String(today.getDate()).padStart(2, "0")}`;

    render();
</script>
